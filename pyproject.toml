[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rto-spc-dashboard"
version = "0.1.0"
description = "RTO SPC Dashboard for synthetic semiconductor tool health monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "plotly>=5.20,<7",
    "pyarrow>=15,<25",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
